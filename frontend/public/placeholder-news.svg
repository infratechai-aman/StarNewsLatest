<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- StarNews Crimson Flare -->
    <radialGradient id="redGlow" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#redGlow)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Subtle Ambient Corner Accents -->
  <path d="M 0 0 L 120 0 L 0 120 Z" fill="rgba(220, 38, 38, 0.15)"/>
  <path d="M 800 450 L 680 450 L 800 330 Z" fill="rgba(220, 38, 38, 0.1)"/>

  <!-- Center News Broadcast Emblem -->
  <g transform="translate(400, 205)">
    <!-- Outer Pulsing Circle -->
    <circle r="52" fill="none" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- Glass Inner Circle -->
    <circle r="42" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- Camera / Broadcast Signal Icon -->
    <path d="M -18 -10 L 8 -10 C 11 -10 13 -8 13 -5 L 13 13 C 13 16 11 18 8 18 L -18 18 C -21 18 -23 16 -23 13 L -23 -5 C -23 -8 -21 -10 -18 -10 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-5" cy="4" r="6" fill="none" stroke="#ef4444" stroke-width="2.2"/>
    <path d="M 13 -2 L 23 -8 L 23 16 L 13 10 Z" fill="#ef4444" opacity="0.9"/>
    
    <!-- Live Beacon Dot -->
    <circle cx="-16" cy="-4" r="2.5" fill="#22c55e"/>
  </g>

  <!-- StarNews India Brand Pill -->
  <g transform="translate(400, 285)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#dc2626" filter="drop-shadow(0 4px 12px rgba(220,38,38,0.4))"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">STARNEWS INDIA</text>
  </g>

  <!-- Tagline / News Bulletin Subtitle -->
  <text x="400" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="1" text-anchor="middle">GROUND REPORT • BREAKING BULLETIN</text>
  <text x="400" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.35)" letter-spacing="0.5" text-anchor="middle">Photo update streaming live</text>
</svg>
